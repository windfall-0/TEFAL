# TEFAL ① 수집 상태 패널용: Prometheus가 Alloy / Loki / Tempo를 수집하게 한다.
# job 이름 = 서비스 이름(alloy, loki, tempo) → 대시보드 쿼리 up{job=~".*(alloy|loki|tempo).*"}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tefal-alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: tefal
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: alloy
      app.kubernetes.io/name: alloy
  endpoints:
    - port: http-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tefal-loki
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: tefal
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: loki
      app.kubernetes.io/name: loki
    matchExpressions:
      # loki-gateway(nginx, 지표 없음)와 loki-headless(중복)는 제외
      - { key: app.kubernetes.io/component, operator: DoesNotExist }
      - { key: variant, operator: DoesNotExist }
  endpoints:
    - port: http-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tefal-tempo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: tefal
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: tempo
      app.kubernetes.io/name: tempo
  endpoints:
    - port: tempo-prom-metrics
      interval: 30s
