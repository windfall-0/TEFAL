# [log4shell / kprobe / observe] sys_execveat — execve 우회 경로 탐지 (memfd 실행 포함) (Post)
# execveat(dfd, filename, ...) 이므로 파일 경로는 index 1. (구 detect-v2 에서 분리)
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: log4shell-kprobe-execveat-observe
  namespace: vuln-lab
  labels:
    tefal.io/vuln: log4shell
    tefal.io/layer: kprobe
    tefal.io/hook: execveat
    tefal.io/action: observe
spec:
  podSelector:
    matchLabels:
      app: log4shell
  kprobes:
  - call: "sys_execveat"
    syscall: true
    args:
    - index: 1
      type: "string"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/lib/jvm/java-1.8-openjdk/jre/bin/java"
      matchActions:
      - action: Post
