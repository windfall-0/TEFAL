# [php2shell / uprobe / observe] libc popen/system — C 표준 명령실행 함수 호출 관측 (Post)
# ⚠️ 경로 PID(4376)는 하드코딩 → php-sync.sh가 현재 PID를 자동 주입해 적용한다. 직접 apply 금지.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: php2shell-uprobe-popen-observe   # (옛 이름: php2shell-libc-sigkill)
  labels:
    tefal.io/vuln: php2shell
    tefal.io/layer: uprobe
    tefal.io/hook: popen
    tefal.io/action: observe
spec:
  uprobes:
  - path: "/procRoot/4052/root/lib/x86_64-linux-gnu/libc.so.6"
    symbols:
    - "popen"
    - "system"
    selectors:
    - matchActions:
      - action: "Post"
