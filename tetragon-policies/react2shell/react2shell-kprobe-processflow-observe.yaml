# [react2shell / kprobe / observe] clone/clone3/execve — 프로세스 생성 흐름 관측 (Post)
# ⚠️ 검증용: 2026-11-04 클러스터에서 로드·검증 후 삭제함. 상시 운영 정책 아님(필요 시에만 적용).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: react2shell-kprobe-processflow-observe   # (옛 이름: r2s-kprobe-process-flow)
  namespace: vuln-lab
  labels:
    tefal.io/vuln: react2shell
    tefal.io/layer: kprobe
    tefal.io/hook: processflow
    tefal.io/action: observe
    tefal.io/stage: research
spec:
  podSelector:
    matchLabels:
      app: react2shell
      lab: vuln
  kprobes:
    - call: sys_clone
      syscall: true
      return: true
      returnArg:
        index: 0
        type: long
    - call: sys_clone3
      syscall: true
      return: true
      returnArg:
        index: 0
        type: long
    - call: sys_execve
      syscall: true
      args:
        - index: 0
          type: string
          label: filename
